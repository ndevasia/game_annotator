<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Post-Game Review</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0d0221, #1a1a40, #2e0249);
      color: #ffffff;
      font-family: "Share Tech Mono", monospace;
      padding: 20px;
      box-sizing: border-box;
    }

    .panel {
      width: min(900px, 95vw);
      background: rgba(8, 10, 32, 0.92);
      border: 2px solid rgba(0, 255, 255, 0.55);
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
      padding: 20px;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    h2 {
      margin: 0 0 10px 0;
      color: #00ffff;
      font-weight: normal;
      text-shadow: 0 0 6px #00ffff;
    }

    p {
      margin: 0 0 14px 0;
      color: #cde6f5;
      line-height: 1.4;
    }

    .chatbot-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 300px;
      max-height: 500px;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
      padding-right: 8px;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: rgba(0, 255, 255, 0.1);
      border-radius: 3px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 255, 0.5);
      border-radius: 3px;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      background: rgba(255, 0, 255, 0.2);
      border-left: 3px solid #ff00ff;
      margin-left: 30px;
    }

    .message.assistant {
      background: rgba(0, 255, 255, 0.15);
      border-left: 3px solid #00ffff;
      margin-right: 30px;
      color: #cde6f5;
    }

    .message.system {
      background: rgba(100, 50, 150, 0.2);
      border-left: 3px solid #aa00ff;
      margin-right: 30px;
      color: #ddaaff;
      font-size: 13px;
    }

    .message.loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00ffff;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-top-color: #00ffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area.hidden {
      display: none;
    }

    #user-input {
      flex: 1;
      border: 1px solid rgba(0, 255, 255, 0.7);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
    }

    #user-input::placeholder {
      color: #666688;
    }

    #user-input:focus {
      outline: none;
      border-color: #ff00ff;
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.3);
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #00ffff;
      background: rgba(0, 0, 0, 0.5);
      color: #00ffff;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      border-color: #00ffff;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.primary {
      border-color: #ff00ff;
      color: #ff00ff;
    }

    button.primary:hover:not(:disabled) {
      border-color: #ff00ff;
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.4);
    }

    .error {
      background: rgba(255, 0, 0, 0.2);
      border-left: 3px solid #ff0000;
      color: #ff6666;
    }

    .fallback-ui {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fallback-ui textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid rgba(0, 255, 255, 0.7);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      padding: 10px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.45;
    }

    .fallback-ui textarea:focus {
      outline: none;
      border-color: #ff00ff;
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2 id="panel-title">Post-Game Review</h2>

    <!-- Chatbot interface -->
    <div id="chatbot-ui" class="chatbot-container">
      <div class="messages" id="messages">
        <div class="message system">
          <span class="spinner"></span> Loading your personalized questions...
        </div>
      </div>
      <div class="input-area" id="input-area">
        <input type="text" id="user-input" placeholder="Your response..." />
        <button type="button" id="send-btn" onclick="sendUserMessage()" disabled>Send</button>
      </div>
    </div>

    <!-- Fallback textarea (hidden by default) -->
    <div id="fallback-ui" class="fallback-ui" style="display: none;">
      <p>Summarize the session in one paragraph. This review will be saved with the video and notes.</p>
      <textarea id="review-input" placeholder="Write a reflection about your gameplay experience today!"></textarea>
    </div>

    <div class="button-group" id="button-group">
      <button type="button" id="skip-btn" onclick="skipReview()">Skip</button>
      <button type="button" class="primary" id="complete-btn" onclick="completeReview()" disabled>Complete Review</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    let sessionData = null;
    let conversationMessages = [];
    let reviewComplete = false;
    let isSendingMessage = false;
    let currentQuestion = null;
    let interviewComplete = false;
    let isChatOnly = false;

    // Listen for session data from main process
    ipcRenderer.on('session-data', (event, data) => {
      console.log('Received session data:', data);
      sessionData = data;
      isChatOnly = data.isChatOnly || false;

      // Update UI based on mode
      if (isChatOnly) {
        document.getElementById('panel-title').textContent = 'Chat About This Session';
        document.getElementById('skip-btn').style.display = 'none';
        document.getElementById('complete-btn').textContent = 'Close';
      }
      
      if (data.reviewMode === 'ai' && data.geminiAvailable) {
        initializeChatbot();
      } else {
        console.warn('Using fallback UI (text review)');
        showFallbackUI();
      }
    });

    function initializeChatbot() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '<div class="message system"><span class="spinner"></span> Generating personalized question...</div>';
      
      ipcRenderer.send('generate-initial-questions', {
        gameTitle: sessionData.gameTitle,
        annotations: sessionData.annotations
      });

      ipcRenderer.once('initial-question-ready', (event, data) => {
        if (data.error) {
          console.error('Error generating question:', data.error);
          showInitialErrorMessage(data.error);
          showFallbackUI();
          return;
        }

        messagesDiv.innerHTML = '';
        currentQuestion = data.question;
        
        if (!currentQuestion) {
          showInitialErrorMessage('Could not generate first question');
          showFallbackUI();
          return;
        }

        // Display the first question
        const msg = document.createElement('div');
        msg.className = 'message assistant';
        msg.textContent = currentQuestion;
        messagesDiv.appendChild(msg);
        
        // Store initial question in conversation
        conversationMessages.push({
          role: 'assistant',
          text: currentQuestion
        });

        // Scroll to bottom
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        // Enable input
        document.getElementById('user-input').focus();
        document.getElementById('send-btn').disabled = false;
        document.getElementById('complete-btn').disabled = false;
      });
    }

    function showFallbackUI() {
      document.getElementById('chatbot-ui').style.display = 'none';
      document.getElementById('fallback-ui').style.display = 'flex';
      document.getElementById('complete-btn').disabled = false;
    }

    function showInitialErrorMessage(errorMsg) {
      const messagesDiv = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.className = 'message error';
      msg.textContent = `Error: ${errorMsg}. Please provide your feedback directly:`;
      messagesDiv.innerHTML = '';
      messagesDiv.appendChild(msg);
    }

    function sendUserMessage() {
      if (isSendingMessage || !sessionData || interviewComplete) return;

      const inputEl = document.getElementById('user-input');
      const userText = inputEl.value.trim();

      if (!userText) return;

      isSendingMessage = true;
      document.getElementById('send-btn').disabled = true;

      // Add user message to display
      const messagesDiv = document.getElementById('messages');
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = userText;
      messagesDiv.appendChild(userMsg);
      conversationMessages.push({
        role: 'user',
        text: userText
      });

      inputEl.value = '';

      // Add loading indicator
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'message loading';
      loadingMsg.id = 'loading-msg';
      loadingMsg.innerHTML = '<span class="spinner"></span> <span>Thinking...</span>';
      messagesDiv.appendChild(loadingMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      // Send message to main process
      ipcRenderer.send('send-chat-message', {
        userMessage: userText,
        gameTitle: sessionData.gameTitle
      });

      ipcRenderer.once('chat-message-received', (event, data) => {
        isSendingMessage = false;

        const loadingEl = document.getElementById('loading-msg');
        if (loadingEl) {
          loadingEl.remove();
        }

        if (data.error) {
          const errorMsg = document.createElement('div');
          errorMsg.className = 'message error';
          errorMsg.textContent = `Error: ${data.error}`;
          messagesDiv.appendChild(errorMsg);
          document.getElementById('send-btn').disabled = false;
        } else {
          // Show acknowledgement
          const ackMsg = document.createElement('div');
          ackMsg.className = 'message assistant';
          ackMsg.textContent = data.response;
          messagesDiv.appendChild(ackMsg);
          
          // Store acknowledgement in conversation
          conversationMessages.push({
            role: 'assistant',
            text: data.response
          });

          if (data.nextQuestion) {
            // Show next question after a brief delay
            currentQuestion = data.nextQuestion;
            setTimeout(() => {
              const nextMsg = document.createElement('div');
              nextMsg.className = 'message assistant';
              nextMsg.textContent = currentQuestion;
              messagesDiv.appendChild(nextMsg);
              
              // Store question in conversation
              conversationMessages.push({
                role: 'assistant',
                text: currentQuestion
              });
              
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
              document.getElementById('user-input').focus();
              document.getElementById('send-btn').disabled = false;
            }, 400);
          } else {
            // Interview is complete
            interviewComplete = true;
            setTimeout(() => {
              const closingMsg = document.createElement('div');
              closingMsg.className = 'message assistant';
              closingMsg.textContent = 'Thank you for sharing your feedback! I appreciate your insights.';
              messagesDiv.appendChild(closingMsg);
              
              // Store closing message in conversation
              conversationMessages.push({
                role: 'assistant',
                text: 'Thank you for sharing your feedback! I appreciate your insights.'
              });
              
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
              document.getElementById('send-btn').disabled = true;
              document.getElementById('user-input').disabled = true;
              document.getElementById('user-input').placeholder = 'Review complete...';
            }, 400);
          }
        }
      });
    }

    function completeReview() {
      if (isChatOnly) {
        // Save chat transcript and close
        saveAndClose();
        return;
      }

      let reviewText = '';

      // Use fallback UI if visible
      if (document.getElementById('fallback-ui').style.display !== 'none') {
        reviewText = document.getElementById('review-input').value.trim();
      } else {
        // Construct review from user responses
        const userResponses = conversationMessages
          .filter(m => m.role === 'user')
          .map(m => m.text)
          .join('\n\n');
        reviewText = userResponses || '';
      }

      reviewComplete = true;
      ipcRenderer.send('post-game-review-submitted', reviewText);
    }

    function saveAndClose() {
      // Send the conversation to main process before closing
      console.log('Saving chat transcript...');
      const transcript = conversationMessages.map(msg => ({
        role: msg.role,
        text: msg.text
      }));
      
      ipcRenderer.send('save-session-chat-transcript', {
        gameTitle: sessionData.gameTitle,
        username: sessionData.username,
        fileTimestamp: sessionData.fileTimestamp,
        transcript: transcript
      });
      
      reviewComplete = true;
      // Small delay to ensure save completes before closing
      setTimeout(() => {
        ipcRenderer.send('post-game-review-window-closed');
      }, 100);
    }

    function skipReview() {
      reviewComplete = true;
      ipcRenderer.send('post-game-review-submitted', '');
    }

    // Handle keyboard shortcuts
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('user-input').addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'enter') {
          event.preventDefault();
          sendUserMessage();
        }
      });
    });

    // Handle window close
    window.addEventListener('beforeunload', () => {
      if (!reviewComplete) {
        ipcRenderer.send('post-game-review-window-closed');
      }
    });

    // Session data is sent automatically by main.js, just wait for it
  </script>
